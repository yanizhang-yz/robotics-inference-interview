[project]
name = "robotics-inference-interview"
version = "0.1.0"
description = "Test-driven robotics inference interview questions with explicit contracts, solutions, and tests"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["questions", "ramp_up"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --import-mode=importlib"
